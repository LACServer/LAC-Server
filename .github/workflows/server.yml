name: L.A.C. Test Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Download L.A. Crimes Linux server
        run: |
          wget -O LAC_Linux_v1.9.6.zip \
            "https://www.lacrimesonline.com/builds/LAC_Linux_v1.9.6.zip"

      - name: Extract server
        run: |
          mkdir -p lac
          unzip -q LAC_Linux_v1.9.6.zip -d lac

      - name: Show server files
        run: |
          echo "===== SERVER FILES ====="
          find lac -type f -print
          echo
          echo "===== EXECUTABLE FILES ====="
          find lac -type f -executable -print

      - name: Test environment
        run: |
          echo "L.A. Crimes server files downloaded successfully."
          echo "This workflow is currently being used to identify the server executable."

      - name: Keep runner alive
        run: |
          echo "Test environment is running."
          sleep 20000
